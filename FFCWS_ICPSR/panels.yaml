# One panel per cell of the landmark x outcome-age triangle (t < T).
# Generated by adapter/build_contract.py; regenerate rather than edit.
# N: 6 sizes up to the 1488 training families of each split.
# K: 660 variables (the birth landmark's count, matched across
# landmarks) and every variable observed by the landmark.
model_spec_version: nkgrid-models-v6-balanced-batch-1
preset: dev
experiment_id: ffcws-icpsr-hardship-v1
data_version: ffcws-icpsr-hardship-ard-v1
repeat_plan:
  - seeds: [12345, 12346, 12347, 12348, 12349, 12350, 12351, 12352, 12353, 12354]
    draws: [0, 1, 2, 3, 4]

preparation:
  adapter: adapter/adapter.py
  contract: adapter/config/hardship.json
  inputs:
    source: 31622-0001-Data.dta
  panel_pattern: 'hardship_t(?P<t>\d+)_T(?P<T>\d+)'
  schema: 'schema/ffcws_icpsr_hardship_lm{t}.json'

panels:
  - name: hardship_t0_T1
    schema: schema/ffcws_icpsr_hardship_lm0.json
    outcome: hardship_1
    models: [ols, ridge, lasso, random_forest, xgboost, lightgbm, shallow_neural_network, extra_trees, super_learner]
    n_grid: [50, 99, 194, 383, 755, 1488]
    k_grid: [660]
    out: outputs/nk_grid_hardship_t0_T1.csv

  - name: hardship_t0_T5
