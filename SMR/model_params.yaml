algorithm_version: nk-grid-v12-classification-cv-6

regression:
  ols:
    fit_intercept: true
  # Regression Ridge uses complete-pipeline 5-fold CV (min(5, N)), no shuffle.
  ridge:
    alpha_log10_min: -4
    alpha_log10_max: 6
    n_alphas: 63
    scoring: neg_mean_squared_error
  lasso:
    # Ratios 1..0.1 of each training fold's alpha_max, ten per decade.
    alpha_scale: relative
    alpha_log10_min: -1
    alpha_log10_max: 0
    n_alphas: 11
    max_cv_folds: 5
    max_iter: 20000
    tol: 0.0001
  random_forest:
    n_estimators: 500
    max_features: sqrt
    min_samples_leaf: 5
  extra_trees:
    n_estimators: 500
    max_features: sqrt
    min_samples_leaf: 5
  shallow_neural_network:
    # Fixed cap 200; ceil(actual fit N / 200) balanced batches, native L2/stopping.
    mlp_batch_size: balanced
    mlp_l2_normalization: batch
    hidden_layer_sizes:
      - 32
    activation: relu
    solver: adam
    alpha_log10_min: -2
    alpha_log10_max: 2
    n_alphas: 5
    max_cv_folds: 3
    learning_rate_init: 0.001
    max_iter: 2000
    early_stopping: false
  super_learner:
    # Fixed cap 200; ceil(actual fit N / 200) balanced batches, native L2/stopping.
    mlp_batch_size: balanced
    mlp_l2_normalization: batch
    cv: 5
    passthrough: false
    ridge_alpha_log10_min: -4
    ridge_alpha_log10_max: 6
    ridge_n_alphas: 63
    ridge_scoring: neg_mean_squared_error
    n_estimators: 500
    max_features: sqrt
    min_samples_leaf: 5
    hidden_layer_sizes:
      - 32
    alpha: 0.01
    learning_rate_init: 0.001
    # Same epoch ceiling as the standalone regression MLP; convergence may stop earlier.
    max_iter: 2000
    positive: true
    lgbm_n_estimators: 200
    lgbm_learning_rate: 0.05
    lgbm_num_leaves: 10
    lgbm_min_data_in_leaf: 10
  xgboost:
    objective: reg:squarederror
    eval_metric: rmse
    max_depth: 2
    eta: 0.3
    max_rounds: 90
    cv_folds: 5
  lightgbm:
    objective: regression
    metric: rmse
    learning_rate: 0.05
    num_leaves: 10
    min_data_in_leaf: 10
    verbosity: -1
    max_rounds: 200
    cv_folds: 5
    early_stopping_rounds: 10

classification:
  # Every model mirrors its regression entry: the same search grids, folds,
  # architecture and stopping, scored by log loss on stratified folds.
  ols:
    C: 1.0e+12
    l1_ratio: 0.0
    solver: lbfgs
    max_iter: 20000
  ridge:
    alpha_log10_min: -4
    alpha_log10_max: 6
    n_alphas: 63
    max_iter: 20000
  lasso:
    # Ratios 1..0.1 of each training fold's alpha_max, ten per decade.
    alpha_scale: relative
    alpha_log10_min: -1
    alpha_log10_max: 0
    n_alphas: 11
    max_cv_folds: 5
    max_iter: 20000
  random_forest:
    n_estimators: 500
    max_features: sqrt
    min_samples_leaf: 5
  extra_trees:
    n_estimators: 500
    max_features: sqrt
    min_samples_leaf: 5
  shallow_neural_network:
    mlp_batch_size: balanced
    mlp_l2_normalization: batch
    hidden_layer_sizes:
      - 32
    activation: relu
    solver: adam
    alpha_log10_min: -2
    alpha_log10_max: 2
    n_alphas: 5
    max_cv_folds: 3
    learning_rate_init: 0.001
    max_iter: 2000
    early_stopping: false
  super_learner:
    mlp_batch_size: balanced
    mlp_l2_normalization: batch
    cv: 5
    passthrough: false
    ridge_alpha_log10_min: -4
    ridge_alpha_log10_max: 6
    ridge_n_alphas: 63
    ridge_max_iter: 20000
    n_estimators: 500
    max_features: sqrt
    min_samples_leaf: 5
    hidden_layer_sizes:
      - 32
    alpha: 0.01
    learning_rate_init: 0.001
    max_iter: 2000
    lgbm_n_estimators: 200
    lgbm_learning_rate: 0.05
    lgbm_num_leaves: 10
    lgbm_min_data_in_leaf: 10
  xgboost:
    objective: binary:logistic
    eval_metric: logloss
    max_depth: 2
    eta: 0.3
    max_rounds: 90
    cv_folds: 5
  lightgbm:
    objective: binary
    metric: binary_logloss
    learning_rate: 0.05
    num_leaves: 10
    min_data_in_leaf: 10
    verbosity: -1
    max_rounds: 200
    cv_folds: 5
    early_stopping_rounds: 10
