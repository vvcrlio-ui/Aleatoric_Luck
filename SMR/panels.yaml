# One catalog for both SMR experiments. Select one with --panel.
# All panels use holdout/OOF caches for eight base models and cache-only SL7.
model_params: model_params.yaml
preset: dev
experiment_id: smr-aleatoric-v1
data_version: smr-ard-v2
model_spec_version: nkgrid-models-v7-relative-lasso-3fold-1

preparation:
  adapter: adapter/adapter.py
  contract: adapter/config/asample2_withlag.json
  inputs:
    source: asample2_withlag.csv
  schema: schema/asample2_withlag.json

panels:
  - &smr_panel
    name: smr_hourlywage
    schema: schema/asample2_withlag.json
    outcome: Cm_lhourlywage
    models:
      - ols
      - ridge
      - lasso
      - random_forest
      - xgboost
      - lightgbm
      - shallow_neural_network
      - extra_trees
      - super_learner
    prediction_cache:
      mode: holdout_oof
      base_library: standalone8-v1
      oof_folds: 5
      # Keep all eight independent columns; do not train the separate SL4 control.
      store_reported_sl_holdout: false
    execution:
      workflow: base_then_sl
      barrier_scope: submission_plan
      protocol_version: 2
      verification_schedule: final_only
      phase_round_limits: {base: 2, sl: 1}
      # Fallback bounds when no unified operational compute policy is selected.
      # The Discoverer policy supplies common base/SL resource limits instead.
      sl_resources:
        worker_cap: 24
        io_concurrency: 8
        memory: 2G
        time_limit: '04:00:00'
    out: outputs/nk_grid_smr_hourlywage.csv

  - <<: *smr_panel
    name: smr_totalincome
    outcome: Cm_ltotalincome
    out: outputs/nk_grid_smr_totalincome.csv
